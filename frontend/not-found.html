<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — Page Not Found</title>
  <link rel="stylesheet" href="styles/main.css"/>
</head>
<body data-page="not-found" style="display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:var(--sp-6)">
  <div>
    <p style="font-size:5rem;font-weight:900;font-family:var(--font-headline);color:var(--color-primary);line-height:1">404</p>
    <h1 style="font-family:var(--font-headline);font-size:var(--text-2xl);font-weight:700;margin:var(--sp-4) 0 var(--sp-2)">Page Not Found</h1>
    <p style="color:var(--color-on-surface-variant);margin-bottom:var(--sp-8)">The page you're looking for doesn't exist or was moved.</p>
    <a href="/index.html" class="btn btn--primary">Back to Dashboard</a>
  </div>
</body>
</html>
